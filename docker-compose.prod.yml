services:
  nginx:
    build: ./nginx
    container_name: nginx
    volumes:
      - ./nginx/conf.d/aladino.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./globalIsc/staticfiles:/usr/src/globalIsc/staticfiles:ro
      - ./globalIsc/apps/media:/usr/src/globalIsc/apps/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - daphne
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./globalIsc
    container_name: backend
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./globalIsc:/usr/src/globalIsc
    env_file:
      - ./.env
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"

  daphne:
    build: ./globalIsc
    container_name: daphne
    command: daphne --bind 0.0.0.0 -p 8002 backend.asgi:application
    volumes:
      - ./globalIsc:/usr/src/globalIsc
    env_file:
      - ./.env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8002"

  db:
    image: postgres:15
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    expose:
      - "5432"

volumes:
  postgres_data:
