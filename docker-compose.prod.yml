services:
  nginx:
    build: ./nginx
    container_name: nginx
    volumes:
      - ./nginx/conf.d/aladino.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - daphne
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./globalIsc
    container_name: backend
    command: >
      sh -c "python manage.py migrate &&
            gunicorn backend.wsgi:application
            --bind 0.0.0.0:8000
            --workers 2
            --threads 2
            --timeout 120
            --access-logfile -
            --error-logfile -
            --log-level debug
            --capture-output"
    volumes:
      - ./globalIsc:/usr/src/backend
    env_file:
      - ./.env
    depends_on:
      - db
    restart: unless-stopped
    expose:
      - "8000"

  daphne:
    build: ./globalIsc
    container_name: daphne
    command: daphne --bind 0.0.0.0 -p 8002 backend.asgi:application
    volumes:
      - ./globalIsc:/usr/src/backend
    env_file:
      - ./.env
    depends_on:
      - db
    restart: unless-stopped
    expose:
      - "8002"

  db:
    image: postgres:15
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: backend
    restart: unless-stopped
    expose:
      - "5432"

volumes:
  postgres_data: