name: Backend Deploy

on:
    workflow_run:
        workflows:
            - Backend CI
        types:
            - completed
        branches:
            - master

concurrency:
    group: backend-production
    cancel-in-progress: false

jobs:
    deploy:
        name: deploy-production

        if: ${{ github.event.workflow_run.conclusion == 'success' }}

        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Deploy backend
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}

                  script: |
                      set -e

                      cd /root/globalOil/backend

                      git fetch origin master
                      git switch master
                      git reset --hard origin/master

                      docker compose -f docker-compose.prod.yml up -d --build web daphne

                      echo "Waiting for backend health check..."

                      for i in $(seq 1 20); do
                        if docker compose -f docker-compose.prod.yml exec -T web \
                          python -c "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host':'muestraslubricantesglobal.com'}); r=urllib.request.urlopen(req, timeout=5); print(r.read().decode()); assert r.status == 200"; then

                          echo "Backend is healthy."
                          break
                        fi

                        if [ "$i" -eq 20 ]; then
                          echo "Backend health check failed."
                          docker compose -f docker-compose.prod.yml logs --tail=100 web
                          exit 1
                        fi

                        echo "Attempt $i/20 failed. Retrying in 3 seconds..."
                        sleep 3
                      done

                      docker compose -f docker-compose.prod.yml ps
