name: Backend Deploy

on:
    workflow_run:
        workflows:
            - Backend CI
        types:
            - completed
        branches:
            - master

concurrency:
    group: backend-production
    cancel-in-progress: false

jobs:
    deploy:
        name: deploy-production

        if: ${{ github.event.workflow_run.conclusion == 'success' }}

        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Deploy backend
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}

                  script: |
                      set -e

                      cd /root/globalOil/backend

                      git fetch origin master
                      git switch master
                      git reset --hard origin/master

                      # Recreate only this project's application services and
                      # remove containers left by retired Compose services.
                      docker compose -f docker-compose.prod.yml up -d --build --force-recreate --remove-orphans web daphne

                      docker compose -f docker-compose.prod.yml restart nginx

                      echo "Waiting for backend health check..."

                      for i in $(seq 1 20); do
                        if docker compose -f docker-compose.prod.yml exec -T web \
                          python -c "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host':'muestraslubricantesglobal.com','X-Forwarded-Proto':'https'}); r=urllib.request.urlopen(req, timeout=5); print(r.read().decode()); assert r.status == 200"; then

                          echo "Backend is healthy."
                          break
                        fi

                        if [ "$i" -eq 20 ]; then
                          echo "Backend health check failed."
                          docker compose -f docker-compose.prod.yml logs --tail=100 web
                          exit 1
                        fi

                        echo "Attempt $i/20 failed. Retrying in 3 seconds..."
                        sleep 3
                      done

                      docker compose -f docker-compose.prod.yml ps

                      # Keep the Docker host bounded without ever pruning volumes.
                      # postgres_data, redis_data and /apps/media are persistent
                      # application data and are deliberately not touched here.
                      # Retaining seven days allows quick rollbacks while removing
                      # obsolete images and BuildKit cache from old deployments.
                      retention="${DOCKER_PRUNE_UNTIL:-168h}"
                      echo "Docker usage before cleanup:"
                      docker system df || true
                      docker container prune --force --filter "until=${retention}" || true
                      docker image prune --all --force --filter "until=${retention}" || true
                      docker builder prune --all --force --filter "until=${retention}" || true
                      echo "Docker usage after cleanup:"
                      docker system df || true
